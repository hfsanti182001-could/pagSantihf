<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Matrícula</title>
    <link rel="stylesheet" href="form-estudiantes.css"/>
</head>
<body>
    <!-- Alerta de notificación -->
    <div id="notificacion" class="alerta">
        <span>🎓 ¡Matrícula registrada con éxito!</span>
        <a href="#" class="alerta-cerrar">×</a>
    </div>
    
    <div class="container-forms">
        <form class="formulario">
            <h2 class="form-title">Nueva matrícula</h2>
         
            <div class="form-inputs" style="display: flex; flex-direction: column; gap: 15px; width: 100%;">
    <select required class="input-select" style="padding: 10px; border-radius: 4px; border: 2px solid #cbd5e1;">
        <option selected disabled value="">Seleccione estudiante</option>
        <option>Luis</option>
        <option>Maria</option>
        <option>Gloria</option>
        <option>Marta</option>
    </select>

    <select required class="input-select" style="padding: 10px; border-radius: 4px; border: 2px solid #cbd5e1;">
        <option selected disabled value="">Seleccione curso</option>
        <option>Programación</option>
        <option>Lógica</option>
        <option>Desarrollo</option>
    </select>

    <select required class="input-select" style="padding: 10px; border-radius: 4px; border: 2px solid #cbd5e1;">
        <option selected disabled value="">Seleccione estado</option>
        <option>Activa</option>
        <option>Completada</option>
        <option>Cancelada</option>
    </select>

    <input type="date" required style="padding: 10px; border-radius: 4px; border: 2px solid #cbd5e1;">
</div>

            <div class="form-buttons" style="display: flex; gap: 20px; width: 100%; margin-top: 20px;">
                <a href="#notificacion" class="boton-feg" style="flex: 1; text-align: center; padding: 12px; text-decoration: none;">Guardar</a>
                <a href="../Matrículas.html" class="boton-fec" style="flex: 1; text-align: center; padding: 12px; text-decoration: none;">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>

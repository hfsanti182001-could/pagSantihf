<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Curso</title>
    <link rel="stylesheet" href="form-estudiantes.css"/>
</head>
<body>
    <!-- Alerta de notificación -->
    <div id="notificacion" class="alerta">
        <span>📚 ¡Curso creado con éxito!</span>
        <a href="#" class="alerta-cerrar">×</a>
    </div>
    
    <div class="container-forms">
        <form class="formulario men" style="width: 100%; max-width: 500px; padding: 30px; background: rgba(255, 255, 255, .95); border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3);">
            <h2 class="form-title" style="margin-bottom: 20px;">Nuevo curso</h2>
         
    <div class="form-inputs" style="display: flex; flex-direction: column; gap: 15px; width: 100%;">
    <input type="text" placeholder="Código" required style="padding: 10px; border-radius: 4px; border: 2px solid #cbd5e1;">
    <input type="text" placeholder="Nombre del curso" required style="padding: 10px; border-radius: 4px; border: 2px solid #cbd5e1;">
    <textarea placeholder="Descripción" rows="4" required style="padding: 10px; border-radius: 4px; border: 2px solid #cbd5e1; font-family: inherit; resize: none;"></textarea>
    <input type="number" placeholder="Capacidad máxima" required style="padding: 10px; border-radius: 4px; border: 2px solid #cbd5e1;">
    </div>

            <div class="form-buttons" style="display: flex; gap: 20px; width: 100%; margin-top: 25px;">
                <a href="#notificacion" class="boton-feg" style="flex: 1; text-align: center; padding: 12px; text-decoration: none;">Guardar</a>
                <a href="../cursos.html" class="boton-fec" style="flex: 1; text-align: center; padding: 12px; text-decoration: none;">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link rel="stylesheet" href="form-estudiantes.css"/>
</head>
<body>
    <!-- Alerta de notificación -->
  <div id="notificacion" class="alerta">
    <span>🎓 ¡Inscripción realizada con éxito!</span>
    <a href="#" class="alerta-cerrar">×</a>
  </div>
  
    <div class="container-forms">
        <form class="formulario">
                 <h2 class="form-title">Registro de Estudiantes</h2>
           
            <div class="form-inputs">
             <label for="Nombre">Nombre:</label>
            <input type="text" name="name">
            <label for="last_name">Apellido:</label>
            <input type="text" name="last_name">
            <label for="email">Correo:</label>
            <input type="text" name="email">
            <label for="phone">Teléfono:</label>
            <input type="text" name="phone">
            </div>

       

                <div class="form-buttons">
                     <button class="boton-feg"><a href="#notificacion" class="btn-accion">Guardar</a></button>
                     <button class="boton-fec"> <a href="../Estudiantes.html">Cancelar</a></button>
                </div>
           
        
      
        </form>
    </div>

</body>
</html>
